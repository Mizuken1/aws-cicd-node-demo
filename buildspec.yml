version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22

  build:
    commands:
      - npm ci
      - npm test
      - rm -rf deploy
      - mkdir -p deploy/scripts
      - cp package.json package-lock.json server.js test.js appspec.yml buildspec.yml deploy/
      - cp scripts/*.sh deploy/scripts/

artifacts:
  base-directory: deploy
  files:
    - "**/*"
  discard-paths: no
